name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv pip install cython setuptools wheel pytest httpx starlette fastapi
      - run: URINGPY_HTTP_PORTABLE=1 uv pip install --no-build-isolation .
      - run: python -m pytest -q
